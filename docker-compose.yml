services:
  db:
    image: postgres:16-alpine
    container_name: clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ClinicReservation
    ports:
      # Host 5433 -> konteyner 5432 (lokal PostgreSQL ilə toqquşmamaq üçün).
      # Override: .env-də DB_PORT=... və ya `DB_PORT=5544 docker compose up`
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ClinicReservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: clinic-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ClinicReservation: "Host=db;Port=5432;Database=ClinicReservation;Username=postgres;Password=postgres"
    ports:
      # Host 8090 -> konteyner 8080. Override: .env-də WEB_PORT=... və ya
      # `WEB_PORT=9000 docker compose up`
      - "${WEB_PORT:-8090}:8080"

volumes:
  pgdata:
