services:
  db:
    image: postgres:16-alpine
    container_name: clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ClinicReservation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ClinicReservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: clinic-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ClinicReservation: "Host=db;Port=5432;Database=ClinicReservation;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"

volumes:
  pgdata:
